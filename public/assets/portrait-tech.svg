<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-label="Abstrakte Systemarchitektur-Visualisierung ohne Personen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1422"/>
      <stop offset="100%" stop-color="#0f1a2c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17253a"/>
      <stop offset="100%" stop-color="#121f31"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38c7ff"/>
      <stop offset="100%" stop-color="#2aa1ff"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c86ff"/>
      <stop offset="100%" stop-color="#62d6ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="610" cy="120" r="150" fill="#38c7ff1f"/>
  <circle cx="120" cy="760" r="170" fill="#7c86ff1f"/>

  <rect x="70" y="110" width="580" height="680" rx="26" fill="#0c1524" stroke="#26364f"/>
  <rect x="94" y="136" width="532" height="632" rx="18" fill="url(#panel)" stroke="#2c415f"/>

  <g font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#dce8ff">
    <text x="130" y="200">System Architecture</text>
  </g>

  <g stroke="#4b6f9a" stroke-width="2" opacity="0.6">
    <line x1="130" y1="230" x2="590" y2="230"/>
  </g>

  <g font-family="Segoe UI, sans-serif" font-size="18" fill="#d5e4ff">
    <rect x="130" y="270" width="460" height="86" rx="14" fill="#15263d" stroke="#3a5478"/>
    <text x="154" y="323">Frontend</text>

    <rect x="130" y="402" width="460" height="86" rx="14" fill="#15263d" stroke="#3a5478"/>
    <text x="154" y="455">Backend</text>

    <rect x="130" y="534" width="460" height="86" rx="14" fill="#15263d" stroke="#3a5478"/>
    <text x="154" y="587">Database</text>

    <rect x="130" y="666" width="460" height="86" rx="14" fill="#15263d" stroke="#3a5478"/>
    <text x="154" y="719">Infrastructure</text>
  </g>

  <g stroke="url(#accentA)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <line x1="360" y1="356" x2="360" y2="392"/>
    <polyline points="348,380 360,392 372,380" fill="none"/>
    <line x1="360" y1="488" x2="360" y2="524"/>
    <polyline points="348,512 360,524 372,512" fill="none"/>
    <line x1="360" y1="620" x2="360" y2="656"/>
    <polyline points="348,644 360,656 372,644" fill="none"/>
  </g>

  <g font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">
    <rect x="470" y="286" width="102" height="30" rx="15" fill="#1a3351" stroke="#4f78a8"/>
    <text x="490" y="307" fill="#d8e8ff">React</text>

    <rect x="446" y="418" width="126" height="30" rx="15" fill="#1a3351" stroke="#4f78a8"/>
    <text x="460" y="439" fill="#d8e8ff">TypeScript</text>

    <rect x="466" y="550" width="106" height="30" rx="15" fill="#1a3351" stroke="#4f78a8"/>
    <text x="485" y="571" fill="#d8e8ff">SQL</text>

    <rect x="452" y="682" width="120" height="30" rx="15" fill="#1a3351" stroke="#4f78a8"/>
    <text x="474" y="703" fill="#d8e8ff">Docker</text>
  </g>

  <g opacity="0.8">
    <circle cx="158" cy="311" r="6" fill="url(#accentB)"/>
    <circle cx="158" cy="443" r="6" fill="url(#accentB)"/>
    <circle cx="158" cy="575" r="6" fill="url(#accentB)"/>
    <circle cx="158" cy="707" r="6" fill="url(#accentB)"/>
  </g>
</svg>
